<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link href="game.css" rel="stylesheet">
    <script src="game.js" defer></script>
</head>
<body>

<header id="top">
    <button id="leaveButton">LEAVE</button>
</header>

<main id="game-layout">

    <div id="left-side">
        <button id="helpButton">HELP</button>
        <div id="info-box">
            <p>Player name:</p>
                <span id="player_name">...</span>
            <p>Monkeys found:</p>
            <span id="monkeys_found">0</span>/10
        </div>
    </div>

    <section id="center">
        <div id="map-area">
            <object id="europe-map" data="images/europemap.svg" type="image/svg+xml"></object>
        </div>

        <div id="guess-area">
            <input type="text" id="guess-input" placeholder="Enter country">
            <button id="guess-button">GUESS</button>
        </div>
    </section>

    <div id="right-side">
        <div id="status-box">
            <h3 id="adventure-title">Adventure log:</h3>
            <ul id="status">

            </ul>
        </div>
    </div>

</main>

</body>
</html>
